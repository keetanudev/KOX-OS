# KOX OS lockscreen PAM policy (user-owned, consumed via PamContext
# configDirectory - no /etc/pam.d change required).
#
# Password check only, through the setuid unix_chkpwd helper. Deliberately
# minimal: no faillock counting (safe to test wrong passwords), no session
# modules, no password-change prompts. Auth semantics match hyprlock's
# `auth include login` for the auth leg without the extras.
auth required pam_unix.so
