# KOX OS - Bluetooth audio policy.
#
# headset-roles = [] removes HSP/HFP entirely: devices register A2DP only,
# so nothing (WirePlumber's autoswitch-bluetooth-profile script included)
# can ever flip a connected headset into handsfree/CVSD mode when an app
# opens a capture stream. Output stays High Fidelity; the BT mic is
# deliberately unavailable. To use a BT mic again, delete the
# headset-roles line and restart wireplumber.
monitor.bluez.properties = {
  bluez5.headset-roles = [ ]
  bluez5.enable-sbc-xq = true
}
