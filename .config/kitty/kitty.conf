font_family JetBrainsMono Nerd Font
font_size 8.0
# kox-scale: live font-size apply via the remote-control socket.
# socket-only limits control to the same-user abstract socket.
allow_remote_control socket-only
listen_on unix:@kox-kitty
window_padding_width 14
background_opacity 0.85
hide_window_decorations yes
# Tiling compositor owns our size. Kitty's remembered window state interacts
# badly with Hyprland: Hyprland reports tiled windows as "maximized", kitty
# saves that on exit and requests it back on the next launch — new kitty
# windows then open fullscreen over everything (kitty #10442).
remember_window_size no
confirm_os_window_close 0
enable_audio_bell no
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# BEGIN KOX theme (managed by kox-theme — do not edit by hand)
cursor #2ec4b6
url_color #2ec4b6
active_border_color #2ec4b6
# END KOX theme
