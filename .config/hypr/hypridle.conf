# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# KOX OS — Idle management (hypridle)             --
# Started from ~/.config/hypr/autostart.lua       --
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
#
#   2 min  → dim the screen
#   5 min  → lock the session
#  15 min  → lock and suspend
#
# kox-suspend picks the suspend command from the running init system
# (systemctl suspend on systemd, loginctl suspend on OpenRC/elogind), and
# locks the session before the machine goes down.

listener {
    timeout = 120
    on-timeout = brightnessctl set 10% || hyprctl dispatch dpms off
    on-resume = brightnessctl set 100% || hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = kox lock
}

listener {
    timeout = 900
    on-timeout = kox-suspend
    on-resume = kox lock
}
