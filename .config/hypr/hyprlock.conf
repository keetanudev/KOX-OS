# RYOKU ORBITAL — hyprlock.conf  (valid for hyprlock 0.9.6)
# Black void, Orbital steel-blue centered clock, dark input pill, white text.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(0a0c10ff)
}

# thin orbital ring behind the clock
shape {
    monitor =
    size = 300, 300
    position = 0, 0
    halign = center
    valign = center
    rounding = -1
    border_size = 1
    color = rgba(7aa2f755)
}

input-field {
    monitor =
    size = 320, 44
    position = 0, 230
    halign = center
    valign = center
    dots_center = true
    fade_on_empty = false
    placeholder_text = Enter password
    outer_color = rgba(4fd6beff)
    inner_color = rgba(000000ff)
    font_color = rgba(ffffffff)
    check_color = rgba(4fd6beff)
    fail_color = rgba(f7768eff)
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = 8
    font_family = JetBrainsMono Nerd Font
    fail_text = $FAIL ($ATTEMPTS)
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgba(7aa2f7ff)
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B %Y"
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(8a93a6ff)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] printf '%s@%s' "$USER" "$(hostname -s)"
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    color = rgba(565e70ff)
    position = 16, 12
    halign = left
    valign = bottom
}
