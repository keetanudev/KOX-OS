# KOX OS — Hyprpaper (0.8.5 schema)
# monitor = * is the wildcard ("*" preferred over "" — hyprlang drops empty keys)
# fit_mode: cover | contain | fill | tile

splash = false

wallpaper {
    monitor = *
    # hyprpaper expands a leading ~ to the invoking user's $HOME, so the
    # shipped config is portable across accounts (the installer deploys it
    # to ~/.config and copies the matching collection to ~/Pictures).
    path = ~/Pictures/Wallpapers/dark-boreal-eclipse-castle.jpg
    fit_mode = cover
}
